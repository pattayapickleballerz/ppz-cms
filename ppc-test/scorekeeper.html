<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPC Scorekeeper</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b2d;color:white;font:14px system-ui,sans-serif}main{max-width:750px;margin:auto;padding:12px}button{font:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center}header small{color:#b8f269}h2{margin:3px 0 14px}.nav{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}.nav button{flex:0 0 52px;height:48px;background:#35485c;border:2px solid transparent;border-radius:8px;color:white;font-weight:900}.nav button.sel{border-color:white}.nav button.pending{background:#d7a32d;color:#172b36}.nav button.verified{background:#208052}.legend{color:#b6c6d3;font-size:11px;margin:8px 0 14px}.card{background:#172638;border:2px solid #40546b;border-radius:17px;padding:13px}.card.pending{border-color:#d7a32d}.card.verified{border-color:#208052}.row{display:flex;justify-content:space-between;align-items:center}.round{color:#f4d25d}.sub{color:#b6c6d3;font-size:12px;margin:8px 0 13px}.roster{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:4px;align-items:center;background:#22354a;padding:10px 6px;border-radius:12px}.side{display:flex;flex-direction:column;gap:10px;min-width:0}.person{display:flex;gap:6px;align-items:center;min-width:0}.person.right{flex-direction:row-reverse;text-align:right}.person b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.person small{display:block;color:#aebed0;font-size:10px}.face{width:35px;height:35px;flex:none;border-radius:50%;border:2px solid #b9d3da;background:#29495a;display:grid;place-items:center}.vs-text{color:#b8f269;font-weight:900}.action,.change,.state{display:block;width:100%;margin-top:12px;padding:13px 6px;border-radius:9px;text-align:center;font-weight:900}.action{background:#208052;border:2px solid #65d99b;color:white}.change{background:#22354a;border:2px solid #8ba3b7;color:white;margin-top:8px}.state{background:#d7a32d;color:#172b36}.state.verified{background:#208052;color:white}.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}.team{background:#10466a;border:2px solid #3999c6;border-radius:12px;padding:9px 5px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}.players{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100%}.player{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}.avatar{width:clamp(40px,10vw,60px);height:clamp(40px,10vw,60px);background:#34799c;border:2px solid #b9d3da;border-radius:50%;display:grid;place-items:center}.player b{font-size:12px}.player small{font-size:10px;color:#c8ddeb}.score{background:transparent;border:0;color:white;font-size:32px;font-weight:900;margin-top:auto}.score.active{color:#f6d44f}.win{width:96%;border:0;border-radius:7px;padding:11px 3px;background:#f6d44f;color:#172b36;font-weight:900}.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:#f6d44f;color:#172b36;border:2px solid #071b2d;border-radius:9px;padding:8px 11px;font-size:16px;font-weight:900;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:10px}.pad button{min-height:40px;border:1px solid #516b83;border-radius:8px;background:#22354a;color:white;font-weight:900}.pad .clear{grid-column:span 2;border-color:#d75b5b;color:#ffabab;font-size:11px}.pad .submit{grid-column:span 2;background:#b8f269;color:#172b36;border:0;font-size:12px}.pad .submit:disabled{opacity:.4}.back{background:#22354a;border:1px solid #6d8295;color:white;border-radius:7px;padding:8px}.message{color:#b8f269;font-size:12px;min-height:15px}.foot{color:#9fb4c5;font-size:11px;text-align:center;margin-top:14px}@media(max-height:520px) and (orientation:landscape){.team{gap:3px;padding:5px}.avatar{height:35px;width:35px}.pad button{min-height:29px}}
</style></head><body><main id="app"></main><script>
const data=[['Dorks','Nuggets',['Pierce','Dee'],['Justin','Trevor']],['Celtics','Mavericks',['Josh','Joe'],['Brock','Dak']],['Chiefs','Bengals',['Patrick','Lamar'],['Josh','Joe']],['Lakers','Warriors',['LeBron','Anthony'],['Stephen','Klay']],['Heat','Celtics',['Jimmy','Bam'],['Jayson','Jaylen']],['Mavericks','Nuggets',['Luka','Kyrie'],['Nikola','Jamal']],['Suns','Bucks',['Devin','Kevin'],['Giannis','Damian']],['Kings','Pacers',['DeAaron','Domantas'],['Tyrese','Pascal']],['Magic','Hawks',['Paolo','Franz'],['Trae','Dejounte']],['Jazz','Grizzlies',['Lauri','Jordan'],['Ja','Desmond']],['76ers','Cavaliers',['Joel','Tyrese'],['Donovan','Darius']]];
const app=document.getElementById('app'),store='ppc_sk_demo_pending_v1';let results={};try{results=JSON.parse(localStorage.getItem(store)||'{}')}catch{}let court=0,editing=false,scores=['',''],winner=null,active=null,message='';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function state(i){return results[i]?'pending':'empty'}
function people(arr,name,right){return '<div class="side">'+arr.map((p,j)=>'<div class="person '+(right?'right':'')+'"><span class="face">'+esc(p[0])+'</span><span><b>'+esc(p)+'</b><small>'+esc(name)+'</small></span></div>').join('')+'</div>'}
function render(){let t=data[court],r=results[court];if(!editing){app.innerHTML='<header><div><small>PPC TOURNAMENT CMS</small><h2>SCOREKEEPER</h2></div><small>LOCAL DEMO</small></header><div class="row"><b>JUMP TO COURT</b><small>'+Object.keys(results).length+' pending</small></div><div class="nav">'+data.map((x,i)=>'<button data-court="'+i+'" class="'+state(i)+(i===court?' sel':'')+'">'+(i+1)+'</button>').join('')+'</div><div class="legend">⬜ No score　🟨 Pending verification　🟩 Verified</div><div class="card '+state(court)+'"><div class="row"><h2 style="margin:0">Court '+(court+1)+'</h2><b class="round">ROUND 1</b></div><div class="sub">'+(court<4?'Beginner':court<8?'Intermediate':'Advanced')+' · Men’s Doubles</div><div class="roster">'+people(t[2],t[0],false)+'<span class="vs-text">VS</span>'+people(t[3],t[1],true)+'</div>'+(r?'<div class="state">⏳ PENDING VERIFICATION · '+r.scores.join('–')+'</div><button class="change" id="open">✎ CHANGE SCORE</button>':'<button class="action" id="open">ENTER SCORE</button>')+'</div><p class="foot">Local demo only · Host / Co-Host verification requires live synchronization.</p>';app.querySelectorAll('[data-court]').forEach(b=>b.onclick=()=>{court=Number(b.dataset.court);render()});app.querySelector('#open').onclick=()=>{editing=true;scores=r?[...r.scores]:['',''];winner=r?.winner??null;active=null;message='';render()};return}
app.innerHTML='<div class="row" style="margin-bottom:12px"><button class="back" id="back">← Courts</button><b>Court '+(court+1)+'</b><small style="color:#b8f269">FIRST TO 11</small></div><div class="match">'+[0,1].map(i=>'<div class="team"><strong>'+esc(t[i]).toUpperCase()+'</strong><div class="players">'+t[i+2].map(p=>'<div class="player"><span class="avatar">'+esc(p[0])+'</span><b>'+esc(p)+'</b><small>'+esc(t[i])+'</small></div>').join('')+'</div><button class="score '+(active===i?'active':'')+'" data-score="'+i+'">'+(scores[i]||'—')+'</button><button class="win" data-win="'+i+'" style="background:'+(winner===null?'#f6d44f':winner===i?'#65d99b':'#f08d8d')+'">'+(winner===null?'WIN':winner===i?'✓ WINNER':'LOSER')+'</button></div>').join('')+'<span class="vs">VS</span></div><div class="pad">'+['1','2','3','4','5','6','7','8','9','0','⌫'].map(k=>'<button data-key="'+k+'">'+k+'</button>').join('')+'<button class="clear" id="clear">CLEAR SCORE</button><button class="submit" id="submit">'+(r?'RESUBMIT':'SUBMIT')+'</button></div><p class="message">'+esc(message)+'</p><p class="foot">Scorekeeper · Awaiting Host / Co-Host approval after submission</p>';
app.querySelector('#back').onclick=()=>{editing=false;render()};app.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.score);message='';render()});app.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{winner=Number(b.dataset.win);scores[winner]='11';if(scores[1-winner]==='11')scores[1-winner]='';active=1-winner;message='Enter losing score.';render()});app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(active===null){message='Tap a score or WIN first.';render();return}let k=b.dataset.key;scores[active]=k==='⌫'?scores[active].slice(0,-1):(scores[active]+k).slice(0,2);message='';render()});app.querySelector('#clear').onclick=()=>{if(!confirm('Clear both scores and winner selection?'))return;scores=['',''];winner=null;active=null;message='Scores cleared.';render()};let submit=app.querySelector('#submit');submit.disabled=!(winner!==null&&scores.every(s=>/^\d+$/.test(s))&&Number(scores[winner])===11&&Number(scores[1-winner])<11);submit.onclick=()=>{results[court]={scores:[...scores],winner,status:'pending',updatedAt:new Date().toISOString()};localStorage.setItem(store,JSON.stringify(results));editing=false;render()}}
render();
</script></body></html>
